
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleat-A-Thon GTA VI Timer</title>
<style>
:root{--pink:#ff35b7;--cyan:#64edff;--gold:#ffb23e;--violet:#55106e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#overlay{height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:12px}
.panel{
 position:relative;width:min(960px,98vw);height:270px;overflow:hidden;
 background:linear-gradient(112deg,rgba(15,7,25,.96),rgba(25,8,35,.95) 54%,rgba(8,15,30,.96));
 border:1px solid rgba(255,53,183,.78);
 box-shadow:0 0 0 1px rgba(100,237,255,.10),0 0 22px rgba(255,53,183,.17),0 0 48px rgba(100,237,255,.08),inset 0 0 40px rgba(100,50,130,.12);
 clip-path:polygon(0 0,97.7% 0,100% 13%,100% 100%,2.3% 100%,0 87%);
}
.panel:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.07) 6px)}
.panel:after{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,var(--pink),transparent 72%);opacity:.8}
.header{height:74px;display:flex;align-items:center;padding:0 38px;position:relative;z-index:2;gap:13px}
.brand-text{
 font-family:Impact,"Arial Black",Arial,sans-serif;font-style:italic;
 font-size:clamp(17px,2.5vw,25px);font-weight:900;letter-spacing:-.045em;
 white-space:nowrap;color:#fff;text-transform:uppercase;
 text-shadow:2px 2px 0 #7b2c91,0 0 12px rgba(255,53,183,.35);
}
.vi-mark{position:relative;width:72px;height:46px;flex:none;filter:drop-shadow(0 2px 5px rgba(255,53,183,.35))}
.vi-mark svg{display:block;width:100%;height:100%;overflow:visible}
.vi-mark .v{
 position:absolute;inset:0 20px 0 0;
 background:linear-gradient(180deg,#3867d9 0%,#a94cbe 52%,#ff9a51 100%);
 clip-path:polygon(0 0,100% 0,54% 100%);
}
.vi-mark .v:after{content:"";position:absolute;inset:5px 5px 6px;background:#170a25;clip-path:polygon(0 0,100% 0,54% 100%)}
.vi-mark .i{
 position:absolute;right:0;top:0;width:18px;height:100%;
 border-left:4px solid #ffb23e;border-right:4px solid #ffb23e;
 background:linear-gradient(180deg,#3867d9 0%,#bb4bb5 55%,#ff9a51 100%);
 box-shadow:0 0 0 2px #55106e,0 0 0 4px #ff35b7;
}
.divider{height:30px;width:1px;background:linear-gradient(transparent,var(--pink),transparent);flex:none;margin-left:3px}
.event{font-size:14px;font-weight:900;letter-spacing:.24em;color:#f7e7f5;white-space:nowrap}
.live{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:900;letter-spacing:.19em;color:var(--cyan);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.clock-wrap{position:absolute;left:0;right:0;top:88px;text-align:center}
#clock{font-family:Arial,Helvetica,sans-serif;font-size:clamp(64px,9.3vw,112px);font-weight:800;letter-spacing:.055em;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.45),0 0 23px rgba(100,237,255,.36),4px 5px 0 rgba(255,53,183,.25)}
.underline{width:315px;max-width:48%;height:2px;margin:17px auto 0;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);box-shadow:0 0 10px rgba(100,237,255,.36)}
.sunset{position:absolute;right:8%;top:57px;width:126px;height:65px;opacity:.15;border-radius:90px 90px 0 0;background:repeating-linear-gradient(to bottom,#ff4ebc 0 5px,transparent 6px 10px);filter:drop-shadow(0 0 9px #ff4ebc)}
.footer{position:absolute;left:38px;right:38px;bottom:24px;display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.2em;color:#d8c7e3}
.footer span:nth-child(2){color:#f0b4df}
@media(max-width:600px){
 .panel{height:220px}
 .header{height:62px;padding:0 18px;gap:9px}
 .brand-text{font-size:clamp(14px,3.5vw,19px)}
 .vi-mark{width:52px;height:34px}
 .vi-mark .v{right:15px}
 .vi-mark .i{width:13px;border-left-width:3px;border-right-width:3px}
 .event{font-size:10px;letter-spacing:.15em}
 .live{font-size:8px;gap:6px;letter-spacing:.12em}
 .clock-wrap{top:78px}
 #clock{font-size:clamp(43px,10vw,72px)}
 .underline{margin-top:13px}
 .footer{left:20px;right:20px;bottom:18px;font-size:8px;letter-spacing:.13em}
 .sunset{right:6%;top:48px;transform:scale(.75)}
}
@media(max-width:420px){
 .header{gap:6px;padding:0 14px}
 .brand-text{font-size:13px}
 .vi-mark{width:43px;height:29px}
 .event{font-size:8px;letter-spacing:.1em}
 .divider{margin-left:0}
 .live{font-size:7px;letter-spacing:.08em}
}

#timer-controls{
 position:fixed;right:18px;bottom:18px;z-index:99999;
 display:flex;align-items:center;gap:8px;padding:9px;
 background:rgba(12,6,22,.94);border:1px solid rgba(255,53,183,.8);
 box-shadow:0 0 16px rgba(255,53,183,.22);border-radius:3px;
}
#timer-status{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.12em;padding:0 5px;white-space:nowrap}
#timer-controls button{min-width:78px;padding:10px 12px;font-size:10px;letter-spacing:.1em}
#timer-controls button.secondary{background:#21152d;border-color:var(--pink)}

#set-time-input{
 width:105px;min-width:0;padding:10px 7px;
 background:#170d24;color:#fff;border:1px solid var(--cyan);
 border-radius:3px;font-size:12px;font-weight:bold;
 text-align:center;letter-spacing:.08em;
}
#timer-controls button{
 background:linear-gradient(135deg,#ff35b7,#9b36b9);
 color:#fff;border:1px solid var(--pink);
 border-radius:3px;font-weight:900;cursor:pointer;
}
#timer-controls button.secondary{background:#21152d;border-color:var(--pink)}
#timer-controls button:hover{filter:brightness(1.2)}
@media(max-width:600px){
 #timer-controls{right:8px;bottom:8px;gap:5px;padding:6px;flex-wrap:wrap;max-width:calc(100vw - 16px)}
 #timer-controls button{min-width:62px;padding:9px 8px;font-size:9px}
 #timer-status{font-size:9px}
 #set-time-input{width:94px;padding:9px 5px;font-size:11px}
}
</style>
</head>
<body>
<div id="overlay">
 <main class="panel">
  <header class="header">
   <div class="brand-text">Grand Theft Auto</div>
   <div class="vi-mark" aria-label="GTA VI V and I emblem">
    <svg viewBox="0 0 112 66" role="img" aria-label="GTA VI V and I emblem">
      <defs>
        <linearGradient id="gtaVFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3264d8"/>
          <stop offset=".42" stop-color="#8b55c8"/>
          <stop offset=".68" stop-color="#f044b8"/>
          <stop offset="1" stop-color="#f39a4c"/>
        </linearGradient>
        <linearGradient id="gtaIFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3264d8"/>
          <stop offset=".42" stop-color="#8b55c8"/>
          <stop offset=".68" stop-color="#f044b8"/>
          <stop offset="1" stop-color="#f39a4c"/>
        </linearGradient>
      </defs>
      <path d="M3 3 H70 L39 62 Z" fill="#4b0870"/>
      <path d="M8 7 H63 L39 53 Z" fill="#ffb333"/>
      <path d="M12 11 H57 L39 45 Z" fill="url(#gtaVFill)"/>
      <path d="M79 3 H109 V63 H79 Z" fill="#4b0870"/>
      <path d="M82 7 H105 V59 H82 Z" fill="#ffb333"/>
      <path d="M86 11 H101 V55 H86 Z" fill="url(#gtaIFill)"/>
    </svg>
   </div>
   <div class="divider"></div>
   <div class="event">FLEAT-A-THON</div>
   <div class="live"><i class="dot"></i>LIVE TIMER</div>
  </header>
  <div class="sunset"></div>
  <section class="clock-wrap">
   <div id="clock">00:00:00</div>
   <div class="underline"></div>
  </section>
  <footer class="footer"><span>VICE CITY</span><span>THE LONG RUN</span></footer>
 </main>
</div>

<div id="timer-controls" aria-label="Timer controls">
 <span id="timer-status" aria-live="polite">READY</span>
 <input id="set-time-input" type="text" inputmode="numeric"
        placeholder="HH:MM:SS" value="00:00:00"
        aria-label="Set timer time">
 <button id="set-time" type="button">SET TIME</button>
 <button id="start" type="button">START</button>
 <button id="pause" class="secondary" type="button">PAUSE</button>
 <button id="reset" class="secondary" type="button">RESET</button>
</div>

<script>
(()=>{
 "use strict";

 const clock=document.getElementById('clock');
 const statusEl=document.getElementById('timer-status');
 const startButton=document.getElementById('start');
 const pauseButton=document.getElementById('pause');
 const resetButton=document.getElementById('reset');
 const setTimeButton=document.getElementById('set-time');
 const setTimeInput=document.getElementById('set-time-input');

 let elapsedMs=0, startedAt=0, running=false, ticker=null;

 function currentElapsed(){
   return elapsedMs + (running ? Date.now()-startedAt : 0);
 }

 function render(){
   const totalSeconds=Math.floor(currentElapsed()/1000);
   const hours=Math.floor(totalSeconds/3600);
   const minutes=Math.floor((totalSeconds%3600)/60);
   const seconds=totalSeconds%60;
   clock.textContent=[hours,minutes,seconds]
     .map(value=>String(value).padStart(2,'0')).join(':');
 }

 function setStatus(value){
   statusEl.textContent=value;
 }

 function start(){
   if(running) return;
   running=true;
   startedAt=Date.now();
   ticker=window.setInterval(render,100);
   render();
   setStatus('RUNNING');
 }

 function pause(){
   if(!running) return;
   elapsedMs=currentElapsed();
   running=false;
   window.clearInterval(ticker);
   ticker=null;
   render();
   setStatus('PAUSED');
 }

 function reset(){
   running=false;
   window.clearInterval(ticker);
   ticker=null;
   elapsedMs=0;
   startedAt=0;
   setTimeInput.value='00:00:00';
   render();
   setStatus('RESET');
 }

 function setTime(){
   const value=setTimeInput.value.trim();
   const match=value.match(/^(\d+):([0-5]?\d):([0-5]?\d)$/);

   if(!match){
     setStatus('USE HH:MM:SS');
     setTimeInput.focus();
     return;
   }

   const hours=Number(match[1]);
   const minutes=Number(match[2]);
   const seconds=Number(match[3]);

   if(!Number.isSafeInteger(hours) || hours<0){
     setStatus('INVALID TIME');
     return;
   }

   elapsedMs=((hours*3600)+(minutes*60)+seconds)*1000;

   if(running){
     startedAt=Date.now();
     setStatus('RUNNING');
   }else{
     setStatus('TIME SET');
   }

   render();
 }

 startButton.addEventListener('click',start);
 pauseButton.addEventListener('click',pause);
 resetButton.addEventListener('click',reset);
 setTimeButton.addEventListener('click',setTime);

 setTimeInput.addEventListener('keydown',event=>{
   if(event.key==='Enter'){
     event.preventDefault();
     setTime();
   }
 });

 document.addEventListener('keydown',event=>{
   const target=event.target;
   const isButton=target && target.tagName==='BUTTON';
   const isInput=target && target.tagName==='INPUT';

   if(event.code==='Space' && !event.repeat && !isButton && !isInput){
     event.preventDefault();
     running ? pause() : start();
   }

   if(event.key && event.key.toLowerCase()==='r' && !isButton && !isInput){
     reset();
   }
 });

 render();
})();
</script>
</body>
</html>
